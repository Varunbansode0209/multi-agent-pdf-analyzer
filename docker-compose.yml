services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pdf-analyzer-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIR: /app/data/vectorstore
      UPLOAD_DIR: /app/data/uploads
      LOG_DIR: /app/logs
      HF_HOME: /app/model_cache
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/vectorstore:/app/data/vectorstore
      - ./logs:/app/logs
      - hf-cache:/app/model_cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pdf-analyzer-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf-cache:
